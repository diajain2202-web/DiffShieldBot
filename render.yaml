services:
  - type: web
    name: diffshield-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DIFFSHIELD_HOLD_HOURS
        value: 12
      - key: DIFFSHIELD_DRY_RUN
        value: 0
      - key: DIFFSHIELD_DB_PATH
        value: diffshield.db
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

